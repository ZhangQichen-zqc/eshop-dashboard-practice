<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course eShop · 经营仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ====== Design Tokens ====== */
:root {
  --bg: #f0f4f8; --card: #fff; --text: #1e293b; --muted: #64748b;
  --primary: #4f46e5; --primary-light: #eef2ff;
  --success: #059669; --success-light: #ecfdf5;
  --warning: #d97706; --warning-light: #fffbeb;
  --danger: #dc2626; --danger-light: #fef2f2;
  --info: #0891b2; --info-light: #ecfeff;
  --border: #e2e8f0; --border-light: #f1f5f9;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04); --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.04);
  --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  --sidebar-w: 232px; --topbar-h: 56px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;line-height:1.5}
a{text-decoration:none;color:inherit}

/* ====== Sidebar ====== */
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;box-shadow:0 0 20px rgba(0,0,0,.03)}
.sidebar-logo{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light)}
.sidebar-logo .logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--primary),#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.sidebar-logo .logo-text{font-weight:700;font-size:14px;color:var(--text)}
.sidebar-logo .logo-badge{font-size:10px;background:var(--success-light);color:var(--success);padding:2px 6px;border-radius:12px;font-weight:500}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.sidebar-nav .nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:12px 12px 4px;font-weight:600}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 0;font-size:13px;color:var(--muted);border-radius:8px;transition:var(--transition);position:relative;font-weight:500}
.sidebar-nav a:hover{background:var(--bg);color:var(--text)}
.sidebar-nav a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.sidebar-nav a.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-nav a .nav-icon{font-size:16px;width:20px;text-align:center}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-light);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sidebar-footer .dot{width:7px;height:7px;background:var(--success);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ====== Main ====== */
.main{margin-left:var(--sidebar-w);flex:1}
.topbar{background:var(--card);padding:0 24px;height:var(--topbar-h);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar .breadcrumb{font-size:13px;color:var(--muted)}
.topbar .breadcrumb span{color:var(--text);font-weight:600}
.topbar-right{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}
.topbar-right .btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:var(--transition)}
.btn-refresh{background:var(--bg);color:var(--text)}
.btn-refresh:hover{background:var(--border)}
.btn-export{background:var(--primary);color:#fff}
.btn-export:hover{background:#4338ca}

.container{padding:20px 24px;max-width:1400px}

/* ====== Page Header ====== */
.page-header{margin-bottom:20px}
.page-title{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.page-desc{font-size:13px;color:var(--muted);margin-top:4px}

/* ====== KPI Cards ====== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);transition:all var(--transition);position:relative;overflow:hidden}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi-card .kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
.kpi-card .kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kpi-card .kpi-value{font-size:24px;font-weight:700}
.kpi-card .kpi-sub{font-size:11px;margin-top:4px}
.kpi-card .kpi-sub.up{color:var(--success)}
.kpi-card .kpi-sub.down{color:var(--danger)}
.kpi-card .kpi-spark{position:absolute;bottom:0;right:0;opacity:.05;font-size:60px}

/* ====== Chart Panels ====== */
.chart-row{display:grid;gap:16px;margin-bottom:20px}
.chart-row.cols-2{grid-template-columns:2fr 1fr}
.chart-row.cols-eq{grid-template-columns:1fr 1fr}
.chart-row.cols-3{grid-template-columns:repeat(3,1fr)}
.panel{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.panel h4{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel canvas{max-height:300px}

/* ====== Data Tables ====== */
.data-table{width:100%;font-size:12px;border-collapse:collapse}
.data-table th{text-align:left;padding:10px 12px;background:var(--bg);border-bottom:2px solid var(--border);font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border-light)}
.data-table tbody tr:hover{background:var(--primary-light)}

/* ====== Alert/Badge ====== */
.alert-row{display:flex;flex-direction:column;gap:8px}
.alert-item{padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.alert-item.critical{background:var(--danger-light);border-color:#fecaca;color:#991b1b}
.alert-item.warn{background:var(--warning-light);border-color:#fde68a;color:#92400e}
.alert-item.info{background:var(--info-light);border-color:#a5f3fc;color:#155e75}
.alert-item.success{background:var(--success-light);border-color:#a7f3d0;color:#065f46}
.alert-item .sev{font-weight:700;font-size:10px;text-transform:uppercase;min-width:28px}

/* ====== Tags ====== */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase}
.tag-primary{background:var(--primary-light);color:var(--primary)}
.tag-success{background:var(--success-light);color:var(--success)}
.tag-warning{background:var(--warning-light);color:var(--warning)}
.tag-danger{background:var(--danger-light);color:var(--danger)}

/* ====== Buttons ====== */
.btn{padding:8px 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;transition:var(--transition);font-family:var(--font)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#4338ca;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ====== Loading & Empty ====== */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.loading .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-card{background:var(--danger-light);color:var(--danger);padding:14px 18px;border-radius:var(--radius-sm);margin:12px 0;font-size:13px}

/* ====== Toast ====== */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;color:#fff;background:#1e293b;box-shadow:0 10px 30px rgba(0,0,0,.15);opacity:0;transform:translateX(40px);transition:all .3s;max-width:360px}
.toast.show{opacity:1;transform:translateX(0)}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}

/* ====== Modal ====== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card);border-radius:var(--radius-lg);padding:28px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.15)}
.modal-box h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-box .close-btn{float:right;background:0;border:0;font-size:20px;cursor:pointer;color:var(--muted);padding:2px 6px}
.modal-box .form-group{margin-bottom:14px}
.modal-box label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text)}
.modal-box input,.modal-box select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);transition:var(--transition)}
.modal-box input:focus,.modal-box select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}

/* ====== Funnel (CSS trapezoid) ====== */
.funnel-container{display:flex;flex-direction:column;align-items:center;gap:0;padding:20px 0;position:relative}
.funnel-layer{position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;transition:all .3s;cursor:pointer;margin-bottom:-2px}
.funnel-layer:hover{filter:brightness(1.1);transform:scale(1.02)}
.funnel-layer .layer-label{position:absolute;right:-140px;color:var(--text);font-size:12px;display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.funnel-layer .layer-label strong{font-size:16px;color:var(--primary)}
.funnel-dash{position:absolute;right:0;border-top:1px dashed var(--border);width:120px}
.funnel-connector{width:2px;height:8px;background:var(--border)}

/* ====== AI Chat ====== */
.ai-chat{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.ai-chat-messages{padding:16px;min-height:300px;max-height:500px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.ai-msg{padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;max-width:85%;line-height:1.6}
.ai-msg.user{align-self:flex-end;background:var(--primary);color:#fff}
.ai-msg.assistant{align-self:flex-start;background:var(--bg)}
.ai-chat-input{display:flex;border-top:1px solid var(--border);padding:10px}
.ai-chat-input textarea{flex:1;border:none;resize:none;padding:8px;font-size:13px;font-family:var(--font);outline:none;min-height:40px}
.ai-chat-input button{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-weight:500;margin-left:8px}

/* ====== Heatmap ====== */
.heatmap-cell{display:inline-block;width:28px;height:28px;border-radius:3px;margin:1px;cursor:pointer;transition:var(--transition)}
.heatmap-cell:hover{transform:scale(1.3);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ====== Progress Bar ====== */
.progress-bar{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .6s ease}
.fill-primary{background:var(--primary)}
.fill-success{background:var(--success)}
.fill-warning{background:var(--warning)}
.fill-danger{background:var(--danger)}

/* ====== Animations ====== */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-in{animation:fadeInUp .4s ease-out}
.fade-in-delay-1{animation:fadeInUp .4s ease-out .05s both}
.fade-in-delay-2{animation:fadeInUp .4s ease-out .1s both}
.fade-in-delay-3{animation:fadeInUp .4s ease-out .15s both}
.kpi-card{animation:scaleIn .35s ease-out}
.kpi-card:nth-child(2){animation-delay:.05s}
.kpi-card:nth-child(3){animation-delay:.1s}
.kpi-card:nth-child(4){animation-delay:.15s}
.kpi-card:nth-child(5){animation-delay:.2s}
.kpi-card:nth-child(6){animation-delay:.25s}
.panel{animation:fadeInUp .4s ease-out}
.skeleton{background:linear-gradient(90deg,var(--border-light) 25%,#e8ecf0 50%,var(--border-light) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}
/* ====== Responsive ====== */
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:transform .3s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .chart-row.cols-2,.chart-row.cols-eq{grid-template-columns:1fr}
  .chart-row.cols-3{grid-template-columns:1fr 1fr}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .topbar .breadcrumb{font-size:12px}
  .funnel-dash{display:none}
}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .panel{padding:14px}
  .page-title{font-size:18px}
  .topbar-right .btn-export{display:none}
  .ai-chat-messages{max-height:300px}
}
@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .chart-row.cols-3{grid-template-columns:1fr}
  .container{padding:10px}
  .topbar{padding:0 12px}
  .kpi-card{padding:14px}
  .kpi-value{font-size:20px}
  .sidebar-logo .logo-text{font-size:12px}
}

.hidden{display:none!important}
/* Performance: use GPU for transforms */
.kpi-card,.panel,.sidebar-nav a,.funnel-layer{will-change:transform}
/* Content-visibility for off-screen panels */
.panel{content-visibility:auto;contain-intrinsic-size:auto 300px}
</style>
</head>
<body>

<!-- ====== Sidebar ====== -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">📊</div>
    <div class="logo-text">eShop 仪表盘</div>
    <span class="logo-badge">v2.0</span>
  </div>
  <div class="sidebar-nav">
    <a href="#home" class="active" data-page="home"><span class="nav-icon">🏠</span>经营总览</a>
    <a href="#funnel" data-page="funnel"><span class="nav-icon">🔻</span>漏斗诊断</a>
    <a href="#customers" data-page="customers"><span class="nav-icon">👥</span>客户分析</a>
    <a href="#products" data-page="products"><span class="nav-icon">🛒</span>商品与购物篮</a>
    <a href="#forecast" data-page="forecast"><span class="nav-icon">📈</span>预测与库存</a>
    <a href="#marketing" data-page="marketing"><span class="nav-icon">📢</span>营销归因</a>
    <a href="#diagnosis" data-page="diagnosis"><span class="nav-icon">🎯</span>综合诊断</a>
    <div class="nav-section">工具</div>
    <a href="#ai" data-page="ai"><span class="nav-icon">🤖</span>AI 分析助手</a>
    <a href="#settings" data-page="settings"><span class="nav-icon">⚙️</span>系统配置</a>
  </div>
  <div class="sidebar-footer"><span class="dot"></span>ETL 模式运行中</div>
</nav>

<!-- ====== Main ====== -->
<div class="main" id="mainContent">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn btn-refresh btn-sm" onclick="toggleSidebar()" style="font-size:16px">☰</button>
      <div class="breadcrumb">首页 / <span id="breadcrumb">经营总览</span></div>
    </div>
    <div class="topbar-right">
      <span id="topTime">--</span>
      <button class="btn btn-refresh btn-sm" onclick="refreshAll()">🔄 刷新数据</button>
    </div>
  </header>
  <div class="container" id="pageContent"></div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ═══════════════════════════════════════════
// PERFORMANCE LAYER: Global cache with TTL
// ═══════════════════════════════════════════
const dataCache = new Map();
const CACHE_TTL = 5 * 60 * 1000; // 5 min
let r4Cached = null;

async function cachedApi(url, ttl = CACHE_TTL) {
  const key = url;
  const entry = dataCache.get(key);
  if (entry && Date.now() - entry.ts < ttl) return entry.data;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`${resp.status}`);
  const data = await resp.json();
  dataCache.set(key, { data, ts: Date.now() });
  return data;
}

function clearCache(pattern = '') {
  if (pattern) {
    for (const k of dataCache.keys()) { if (k.includes(pattern)) dataCache.delete(k); }
  } else {
    dataCache.clear();
  }
}

// ═══════════════════════════════════════════
// CHART ENGINE: Reuse + destroy
// ═══════════════════════════════════════════
const chartInstances = {};
function renderChart(id, type, data, options = {}) {
  if (chartInstances[id]) chartInstances[id].destroy();
  const canvas = document.getElementById(id);
  if (!canvas) return null;
  chartInstances[id] = new Chart(canvas.getContext('2d'), {
    type, data, options: { responsive: true, maintainAspectRatio: true, ...options }
  });
  return chartInstances[id];
}
function destroyAllCharts() {
  Object.values(chartInstances).forEach(c => c.destroy());
  for (const k in chartInstances) delete chartInstances[k];
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
let currentPage = 'home';

function navTo(page, el) {
  currentPage = page;
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('breadcrumb').textContent = el?.textContent?.trim() || page;
  loadPage(page);
  // Close sidebar on mobile
  if (window.innerWidth < 1024) document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// Preload pages on hover
document.querySelectorAll('.sidebar-nav a[data-page]').forEach(a => {
  a.addEventListener('mouseenter', () => {
    const page = a.dataset.page;
    if (page && typeof pagePreloaders[page] === 'function' && page !== currentPage) {
      pagePreloaders[page]();
    }
  });
});

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
const F = v => v != null ? '¥' + (v / 10000).toFixed(0) + '万' : '--';
const N = v => v != null ? v.toLocaleString() : '--';
const P = v => v != null ? (v * 100).toFixed(1) + '%' : '--';

function momHtml(v) {
  if (v == null) return '';
  const cls = v >= 0 ? 'up' : 'down';
  return `<span class="kpi-sub ${cls}">${v >= 0 ? '↑' : '↓'} ${Math.abs(v).toFixed(1)}% vs 上月</span>`;
}

function showToast(msg, type = 'success') {
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  w.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

function showLoading(ct) {
  ct.innerHTML = `<div class="loading"><div class="spinner"></div>加载中...</div>`;
}

function showError(ct, msg) {
  ct.innerHTML = `<div class="error-card">⚠️ ${msg}</div>`;
}

// ═══════════════════════════════════════════
// PAGE LOADER
// ═══════════════════════════════════════════
let loadDebounceTimer = null;
function loadPage(page) {
  const ct = document.getElementById('pageContent');
  // Debounce: cancel stale page loads on rapid switching
  if (loadDebounceTimer) clearTimeout(loadDebounceTimer);
  destroyAllCharts();
  showLoading(ct);
  loadDebounceTimer = setTimeout(() => {
    if (pageRenderers[page]) {
      pageRenderers[page](ct).catch(e => showError(ct, e.message));
    } else {
      ct.innerHTML = '<div class="error-card">页面未找到</div>';
    }
  }, 50); // 50ms debounce for rapid switches
}

// Lazy chart rendering: defer non-critical charts
function lazyRenderChart(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  // Use IntersectionObserver or simply defer
  requestAnimationFrame(() => requestAnimationFrame(fn));
}

// ====== Preloaders ======
const pagePreloaders = {
  home() { cachedApi('/api/r1/kpi'); cachedApi('/api/r11/summary'); cachedApi('/api/r1/trends'); },
  funnel() { cachedApi('/api/r2/funnel'); cachedApi('/api/r2/dropoff-analysis'); },
  customers() { cachedApi('/api/r3/rfm-layers'); cachedApi('/api/r3/cohort-retention'); },
  products() { cachedApi('/api/r6/association-rules'); },

// ═══════════════════════════════════════════
// AI FUNCTIONS
// ═══════════════════════════════════════════
function askAI(msg) { document.getElementById('aiInput').value = msg; sendAIMessage(); }
function saveAIConfig() {
  const model = document.getElementById('aiModel').value.trim();
  const key = document.getElementById('aiKey').value.trim();
  const baseUrl = document.getElementById('aiBaseUrl').value.trim();
  if (!model || !key) { showToast('请填写模型名称和 API Key', 'error'); return; }
  localStorage.setItem('ai_model', model);
  localStorage.setItem('ai_key', key);
  localStorage.setItem('ai_base_url', baseUrl);
  showToast('AI 配置已保存！');
}

async function sendAIMessage() {
  const input = document.getElementById('aiInput');
  const msg = input.value.trim();
  if (!msg) return;
  const model = localStorage.getItem('ai_model');
  const key = localStorage.getItem('ai_key');
  const baseUrl = localStorage.getItem('ai_base_url') || 'https://api.deepseek.com';
  if (!model || !key) { showToast('请先配置模型和 API Key', 'error'); return; }

  const msgsDiv = document.getElementById('aiMessages');
  msgsDiv.innerHTML += `<div class="ai-msg user">${msg}</div>`;
  input.value = '';
  msgsDiv.scrollTop = msgsDiv.scrollHeight;

  // Collect current context
  let context = '';
  try {
    const [kpi, summary] = await Promise.all([cachedApi('/api/r1/kpi'), cachedApi('/api/r11/summary').catch(() => null)]);
    context = `当前经营数据：GMV=¥${(kpi.kpi.gmv/1e8).toFixed(2)}亿, 订单=${kpi.kpi.order_count.toLocaleString()}, 毛利率=${kpi.kpi.gross_margin}%, 退款率=${kpi.kpi.refund_rate}%, 转化率=${kpi.kpi.conversion_rate}%。`;
    if (summary) context += ` 健康度=${summary.health?.total_score}/100 (${summary.health?.grade})。`;
  } catch (e) {}

  try {
    const resp = await fetch(`${baseUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model, messages: [
          { role: 'system', content: `你是电商经营分析专家。基于以下背景提供简明建议：${context}` },
          { role: 'user', content: msg }
        ], max_tokens: 1000, temperature: 0.7
      })
    });
    if (!resp.ok) throw new Error(`${resp.status}`);
    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content || '无法获取回复';
    msgsDiv.innerHTML += `<div class="ai-msg assistant">${reply.replace(/\n/g, '<br>')}</div>`;
  } catch (e) {
    msgsDiv.innerHTML += `<div class="ai-msg assistant" style="color:var(--danger)">❌ API 调用失败：${e.message}。请检查 Base URL 和 API Key 是否正确。</div>`;
  }
  msgsDiv.scrollTop = msgsDiv.scrollHeight;
}

// User search
async function searchUsers() {
  const q = document.getElementById('cUserSearch').value.trim();
  const ct = document.getElementById('cSearchResult');
  if (!q) { ct.innerHTML = '<p style="font-size:12px;color:var(--muted)">请输入用户名或ID</p>'; return; }
  ct.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const data = await cachedApi('/api/r3/search-users?keyword=' + encodeURIComponent(q) + '&limit=20');
    const users = data.users || [];
    ct.innerHTML = users.length ?
      `<table class="data-table"><thead><tr><th>用户ID</th><th>分群</th><th>GMV</th></tr></thead><tbody>${users.map(u=>`<tr><td>${u.user_id||u.userId}</td><td>${u.segment||'--'}</td><td>¥${u.monetary||0}</td></tr>`).join('')}</tbody></table>` :
      '<p style="font-size:12px;color:var(--muted);padding:8px">未找到匹配用户</p>';
  } catch(e) { ct.innerHTML = `<div class="error-card">搜索失败: ${e.message}</div>`; }
}

// Product search for recs
async function searchProductRec() {
  const sku = document.getElementById('pSkuInput').value.trim();
  if (!sku) return;
  try {
    const data = await cachedApi('/api/r6/product-recommendations/' + encodeURIComponent(sku));
    const recs = data.recommendations || [];
    document.getElementById('pSearchResult').innerHTML = recs.length ?
      recs.map(r => `<div class="alert-item info"><span class="sev">→</span>${r.consequent||r.sku_id||'--'} (lift: ${(r.lift||0).toFixed(1)})</div>`).join('') :
      '<p style="font-size:12px;color:var(--muted)">未找到推荐</p>';
  } catch (e) { document.getElementById('pSearchResult').innerHTML = `<div class="error-card">查询失败: ${e.message}</div>`; }
}
